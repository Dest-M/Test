<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Канбан - Контроль заказов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📋 Канбан — Контроль заказов</h1>
    <p class="subtitle">
        <strong>Кейс № 1:</strong> Интеграция системы контроля заказов в магазине &nbsp;|&nbsp;
        <strong>Сударева Анна Дмитриевна</strong> — ООО «Айти-Солюшн»
    </p>

    <div class="add-form">
        <div class="field">
            <label>Клиент</label>
            <input type="text" id="client" placeholder="ФИО клиента">
        </div>
        <div class="field">
            <label>Товар</label>
            <input type="text" id="product" placeholder="Наименование">
        </div>
        <div class="field">
            <label>Сумма (₽)</label>
            <input type="number" id="amount" placeholder="0">
        </div>
        <button onclick="addOrder()">➕ Добавить</button>
    </div>

    <div class="kanban" id="kanbanBoard">
        <div class="column col-new" data-status="Новый">
            <div class="column-header">📌 Новый <span class="count" id="count-new">0</span></div>
            <div class="cards-container" id="col-new"></div>
        </div>

        <div class="column col-processing" data-status="В обработке">
            <div class="column-header">⚙️ В обработке <span class="count" id="count-processing">0</span></div>
            <div class="cards-container" id="col-processing"></div>
        </div>

        <div class="column col-shipped" data-status="Отправлен">
            <div class="column-header">🚚 Отправлен <span class="count" id="count-shipped">0</span></div>
            <div class="cards-container" id="col-shipped"></div>
        </div>

        <div class="column col-delivered" data-status="Доставлен">
            <div class="column-header">✅ Доставлен <span class="count" id="count-delivered">0</span></div>
            <div class="cards-container" id="col-delivered"></div>
        </div>

        <div class="column col-cancelled" data-status="Отменен">
            <div class="column-header">❌ Отменен <span class="count" id="count-cancelled">0</span></div>
            <div class="cards-container" id="col-cancelled"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
