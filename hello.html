<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Канбан - Контроль заказов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>📋 Канбан — Контроль заказов</h1>
    <p class="subtitle">
        <strong>Кейс № 1:</strong> Интеграция системы контроля заказов в магазине &nbsp;|&nbsp;
        <strong>Сударева Анна Дмитриевна</strong> — ООО «Айти-Солюшн»
    </p>

    <!-- Форма добавления -->
    <div class="add-form">
        <div class="field">
            <label>Клиент</label>
            <input type="text" id="client" placeholder="ФИО клиента">
        </div>
        <div class="field">
            <label>Товар</label>
            <input type="text" id="product" placeholder="Наименование">
        </div>
        <div class="field">
            <label>Сумма (₽)</label>
            <input type="number" id="amount" placeholder="0">
        </div>
        <button onclick="addOrder()">➕ Добавить</button>
    </div>

    <!-- Канбан-доска -->
    <div class="kanban" id="kanbanBoard">
        <!-- Новый -->
        <div class="column col-new" data-status="Новый">
            <div class="column-header">📌 Новый <span class="count" id="count-new">0</span></div>
            <div class="cards-container" id="col-new"></div>
        </div>

        <!-- В обработке -->
        <div class="column col-processing" data-status="В обработке">
            <div class="column-header">⚙️ В обработке <span class="count" id="count-processing">0</span></div>
            <div class="cards-container" id="col-processing"></div>
        </div>

        <!-- Отправлен -->
        <div class="column col-shipped" data-status="Отправлен">
            <div class="column-header">🚚 Отправлен <span class="count" id="count-shipped">0</span></div>
            <div class="cards-container" id="col-shipped"></div>
        </div>

        <!-- Доставлен -->
        <div class="column col-delivered" data-status="Доставлен">
            <div class="column-header">✅ Доставлен <span class="count" id="count-delivered">0</span></div>
            <div class="cards-container" id="col-delivered"></div>
        </div>

        <!-- Отменен -->
        <div class="column col-cancelled" data-status="Отменен">
            <div class="column-header">❌ Отменен <span class="count" id="count-cancelled">0</span></div>
            <div class="cards-container" id="col-cancelled"></div>
        </div>
    </div>
</div>

<script>
    // Статусы в порядке движения (для кнопок влево/вправо)
    const STATUSES = ['Новый', 'В обработке', 'Отправлен', 'Доставлен', 'Отменен'];

    // Начальные данные
    let orders = [
        { id: 1, client: 'Иванов И.И.', product: 'Ноутбук ASUS', amount: 45000, status: 'Новый' },
        { id: 2, client: 'Петрова А.С.', product: 'Смартфон Xiaomi', amount: 32000, status: 'В обработке' },
        { id: 3, client: 'Сидоров В.П.', product: 'Наушники Sony', amount: 8500, status: 'Доставлен' },
        { id: 4, client: 'Козлова М.Д.', product: 'Планшет iPad', amount: 28000, status: 'Отправлен' },
        { id: 5, client: 'Новиков А.А.', product: 'Клавиатура Logitech', amount: 4200, status: 'Новый' },
        { id: 6, client: 'Морозова Е.В.', product: 'Монитор Dell', amount: 18000, status: 'Отменен' }
    ];

    let nextId = 7;

    // Рендеринг всех карточек
    function renderBoard() {
        // Очищаем все колонки
        STATUSES.forEach(status => {
            const container = document.getElementById('col-' + getStatusId(status));
            if (container) container.innerHTML = '';
        });

        // Распределяем заказы по колонкам
        orders.forEach(order => {
            const container = document.getElementById('col-' + getStatusId(order.status));
            if (container) {
                container.appendChild(createCard(order));
            }
        });

        // Обновляем счетчики
        STATUSES.forEach(status => {
            const count = orders.filter(o => o.status === status).length;
            const el = document.getElementById('count-' + getStatusId(status));
            if (el) el.textContent = count;
        });
    }

    // Получить ID для статуса (для id контейнеров)
    function getStatusId(status) {
        const map = {
            'Новый': 'new',
            'В обработке': 'processing',
            'Отправлен': 'shipped',
            'Доставлен': 'delivered',
            'Отменен': 'cancelled'
        };
        return map[status] || status;
    }

    // Создание карточки
    function createCard(order) {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = order.id;

        const statusIndex = STATUSES.indexOf(order.status);

        card.innerHTML = `
            <div class="id">#${order.id}</div>
            <div class="client">${order.client}</div>
            <div class="product">${order.product}</div>
            <div class="amount">${order.amount.toLocaleString()} ₽</div>
            <div class="card-actions">
                ${statusIndex > 0 ? `<button class="btn-left" onclick="moveOrder(${order.id}, 'left')">◀</button>` : ''}
                ${statusIndex < STATUSES.length - 1 ? `<button class="btn-right" onclick="moveOrder(${order.id}, 'right')">▶</button>` : ''}
                <button class="btn-delete" onclick="deleteOrder(${order.id})">🗑</button>
            </div>
        `;

        return card;
    }

    // Перемещение заказа
    function moveOrder(id, direction) {
        const order = orders.find(o => o.id === id);
        if (!order) return;

        const currentIndex = STATUSES.indexOf(order.status);
        let newIndex;

        if (direction === 'left') {
            newIndex = Math.max(0, currentIndex - 1);
        } else {
            newIndex = Math.min(STATUSES.length - 1, currentIndex + 1);
        }

        if (newIndex !== currentIndex) {
            order.status = STATUSES[newIndex];
            renderBoard();
        }
    }

    // Добавление заказа
    function addOrder() {
        const client = document.getElementById('client').value.trim();
        const product = document.getElementById('product').value.trim();
        const amount = parseFloat(document.getElementById('amount').value);

        if (!client || !product || !amount) {
            alert('Заполните все поля!');
            return;
        }

        orders.push({
            id: nextId++,
            client: client,
            product: product,
            amount: amount,
            status: 'Новый'
        });

        document.getElementById('client').value = '';
        document.getElementById('product').value = '';
        document.getElementById('amount').value = '';

        renderBoard();
    }

    // Удаление заказа
    function deleteOrder(id) {
        if (confirm('Удалить заказ #' + id + '?')) {
            orders = orders.filter(o => o.id !== id);
            renderBoard();
        }
    }

    // Первоначальный рендеринг
    renderBoard();
</script>

</body>
</html>
